[workspace]
resolver = "2"
members = [
    "crates/claw-core",
    "crates/claw-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SuperInstance Team"]
license = "MIT"

[workspace.dependencies]
# Core
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"

# Runtime
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
dashmap = "6.0" # Concurrent HashMap for Subagent Registry
