version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collaborative-planner
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/planner
      - REDIS_URL=redis://redis:6379
      - CLAW_ENDPOINT=ws://claw:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:3000
    depends_on:
      - postgres
      - redis
      - claw
    restart: unless-stopped
    networks:
      - planner

  postgres:
    image: postgres:15-alpine
    container_name: planner-postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=planner
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - planner

  redis:
    image: redis:7-alpine
    container_name: planner-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - planner

  claw:
    image: superinstance/claw:latest
    container_name: planner-claw
    environment:
      - CLAW_API_KEY=${CLAW_API_KEY}
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - planner

volumes:
  postgres-data:
  redis-data:

networks:
  planner:
    driver: bridge
